plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aidms.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.aidms.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Signing details live in android/keystore.properties (not committed).
    // Without it, the release build falls back to the debug key.
    def ksFile = rootProject.file("keystore.properties")
    def ks = new Properties()
    if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile file(ks["storeFile"])
                storePassword ks["storePassword"]
                keyAlias ks["keyAlias"]
                keyPassword ks["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    // The UI is shared with the iOS app and lives in /web at the repo root.
    sourceSets {
        main.assets.srcDirs = ['../../web']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
